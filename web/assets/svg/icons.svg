<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- Previous -->
  <symbol id="icon-previous" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 5.5 8 12l6.5 6.5"/>
      <path d="M9 12h11"/>
    </g>
  </symbol>

  <!-- Forward / Next -->
  <symbol id="icon-forward" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 5.5 16 12l-6.5 6.5"/>
      <path d="M15 12H4"/>
    </g>
  </symbol>

  <!-- First -->
  <symbol id="icon-first" viewBox="0 0 25 24">
    <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 5v14"/>
      <path d="M13 5.5 7 12 13 18.5"/>
      <path d="M20 5.5 14 12 20 18.5"/>
    </g>
  </symbol>

  <!-- Last -->
  <symbol id="icon-last" viewBox="0 0 25 24">
    <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 5v14"/>
      <path d="M5 5.5 11 12 5 18.5"/>
      <path d="M12 5.5 18 12 12 18.5"/>
    </g>
  </symbol>

  <!-- View -->
  <symbol id="icon-view" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.7 12s3.6-6.2 9.3-6.2S21.3 12 21.3 12 17.7 18.2 12 18.2 2.7 12 2.7 12z"/>
      <circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>
    </g>
  </symbol>

  <!-- Listen -->
  <symbol id="icon-listen" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5L6 9H3v6h3l5 4V5z"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
    </g>
  </symbol>

  <!-- Header -->
  <symbol id="icon-header" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="5" width="17" height="14" rx="2.5"/>
      <path d="M7 9h10"/>
      <path d="M7 12.5h10"/>
      <path d="M7 16h7"/>
    </g>
  </symbol>

  <!-- Email -->
  <symbol id="icon-email" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="6" width="18" height="13" rx="2.6"/>
      <path d="M4.5 8 12 14l7.5-6"/>
    </g>
  </symbol>

  <!-- Favicon / df mark -->
  <symbol id="icon-df" viewBox="0 0 64 64">
    <rect x="5" y="5" width="54" height="54" rx="15" fill="#141719"/>
    <text
      x="32"
      y="45"
      text-anchor="middle"
      font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif"
      font-size="36"
      font-weight="900"
      letter-spacing="-3"
      fill="#fff">df</text>
  </symbol>

  <!-- No Dairy / crossed carton and glass -->
  <symbol id="icon-no-dairy" viewBox="0 0 96 96">
    <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="48" cy="48" r="38"/>
      <path d="M22 74 74 22"/>
      <path d="M39 27h18l5 13v32H34V40z"/>
      <path d="M39 27 34 40h28"/>
      <path d="M39 27v13"/>
      <path d="M29 53h16v22H29z"/>
      <path d="M30 53c3-5 11-5 14 0"/>
    </g>
  </symbol>

</svg>