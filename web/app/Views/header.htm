<!DOCTYPE html>
<html lang="en">
  <head>

    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{{ @site_title }}</title>

    <check if="{{ isset(@title) }}">
      <true>
        <meta property="og:title" content="{{ @title }}">
      </true>
      <false>
        <meta property="og:title" content="{{ @site_title }}">
      </false>
    </check>

    <meta property="og:site_name" content="{{ @site_title }}">
    <meta property="og:image" content="assets/svg/header-dairy-free.svg">
    <meta property="og:description" content="{{ @site_description }}">
    <meta property="og:url" content="{{ @site_url }}">

    <meta name="description" content="{{ @site_description }}">

    <link rel="stylesheet" type="text/css" media="all" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" media="all" href="/assets/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" media="all" href="/assets/css/display.css">
    <link rel="icon" type="image/svg+xml" href="/assets/svg/favicon.svg">

  </head>
  <body>
    <include href="assets/svg/icons.svg" />
    <div class="d-flex flex-column min-vh-100">

      <check if ="{{ isset(@SESSION.uid) }}">
        <true>
          <include href="app/Views/adminBar.htm" />
          <include href="app/Views/navBar.htm" />
        </true>
      </check>
      <div class="main flex-fill">
      <div id="header" class="container-fluid">
        <include href="app/Views/statusMessage.htm" />

        <check if ="{{ isset(@SESSION.uid) }}">
          <false>
            <include href="app/Views/navBar.htm" />
          </false>
        </check>

      </div>
